          package com.example.customkeyboard

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.*
          import android.view.View
          import android.view.animation.LinearInterpolator

          /** Thin animated strip that flows through red RGB shades. */
          class RgbBarView(ctx: Context) : View(ctx) {
              private val paint = Paint()
              private val matrix = Matrix()
              private var shader: LinearGradient? = null
              private var phase = 0f
              private var wantAnim = true

              private val animator = ValueAnimator.ofFloat(0f, 1f).apply {
                  duration = 2200
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener { phase = it.animatedValue as Float; invalidate() }
              }

              fun setAnimated(on: Boolean) {
                  wantAnim = on
                  if (on && isAttachedToWindow) animator.start() else animator.cancel()
                  invalidate()
              }

              private var colors = intArrayOf(
                  Color.parseColor("#FF1744"), Color.parseColor("#FF5252"),
                  Color.parseColor("#D50000"), Color.parseColor("#FF4081"),
                  Color.parseColor("#FF1744")
              )

              /** mode 0 = accent shades, 1 = accent <-> blue, 2 = full RGB rainbow. */
              fun setPalette(accent: Int, mode: Int) {
                  colors = when (mode) {
                      2 -> intArrayOf(Color.RED, Color.YELLOW, Color.GREEN, Color.CYAN, Color.BLUE, Color.MAGENTA, Color.RED)
                      1 -> {
                          val blue = Color.parseColor("#5CC8FF")
                          intArrayOf(accent, blue, accent, blue, accent)
                      }
                      else -> {
                          val hsv = FloatArray(3)
                          Color.colorToHSV(accent, hsv)
                          fun variant(dh: Float, ds: Float, dv: Float) = Color.HSVToColor(
                              floatArrayOf((hsv[0] + dh + 360f) % 360f, (hsv[1] * ds).coerceIn(0f, 1f), (hsv[2] * dv).coerceIn(0f, 1f))
                          )
                          intArrayOf(accent, variant(0f, 0.65f, 1f), variant(0f, 1f, 0.7f), variant(14f, 1f, 1f), accent)
                      }
                  }
                  rebuild()
              }

              private fun rebuild() {
                  if (width == 0) return
                  shader = LinearGradient(0f, 0f, width.toFloat(), 0f, colors, null, Shader.TileMode.REPEAT)
                  paint.shader = shader
                  invalidate()
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) = rebuild()

              override fun onDraw(canvas: Canvas) {
                  matrix.setTranslate(phase * width, 0f)
                  shader?.setLocalMatrix(matrix)
                  canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), paint)
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  if (wantAnim) animator.start()
              }

              override fun onDetachedFromWindow() {
                  animator.cancel()
                  super.onDetachedFromWindow()
              }
          }
