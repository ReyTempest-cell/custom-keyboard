name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Write project files
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'KBEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.customkeyboard"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.customkeyboard"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.1")
          }
          KBEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'KBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CustomKeyboardService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.example.customkeyboard.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          KBEOF
          mkdir -p app/src/main/java/com/example/customkeyboard
          cat > app/src/main/java/com/example/customkeyboard/ClipboardStore.kt <<'KBEOF'
          package com.example.customkeyboard

          import android.content.Context
          import org.json.JSONArray
          import java.io.File

          /** Stores up to 30 recent clips. Image clips are saved as "IMG:<filename>". */
          class ClipboardStore(private val ctx: Context) {
              private val p = ctx.getSharedPreferences("clip", Context.MODE_PRIVATE)

              fun all(): List<String> {
                  val a = JSONArray(p.getString("items", "[]"))
                  return (0 until a.length()).map { a.getString(it) }
              }

              fun add(item: String) {
                  if (item.isBlank()) return
                  val l = all().toMutableList()
                  l.remove(item)
                  l.add(0, item)
                  l.drop(30).forEach { deleteFile(it) }
                  save(l.take(30))
              }

              fun remove(item: String) {
                  deleteFile(item)
                  save(all().filter { it != item })
              }

              fun clear() {
                  all().forEach { deleteFile(it) }
                  save(emptyList())
              }

              private fun deleteFile(item: String) {
                  if (item.startsWith("IMG:")) File(ImageShare.dir(ctx), item.removePrefix("IMG:")).delete()
              }

              private fun save(l: List<String>) {
                  p.edit().putString("items", JSONArray(l).toString()).apply()
              }
          }
          KBEOF
          mkdir -p app/src/main/java/com/example/customkeyboard
          cat > app/src/main/java/com/example/customkeyboard/CustomKeyboardService.kt <<'KBEOF'
          package com.example.customkeyboard

          import android.animation.ValueAnimator
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.inputmethodservice.InputMethodService
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.MediaStore
          import android.text.InputType
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.animation.LinearInterpolator
          import android.view.animation.OvershootInterpolator
          import android.view.inputmethod.EditorInfo
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.PopupWindow
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.core.content.FileProvider
          import androidx.core.graphics.ColorUtils
          import java.io.File
          import java.util.concurrent.Executors
          import kotlin.math.PI
          import kotlin.math.sin

          class CustomKeyboardService : InputMethodService() {

              private enum class Mode { KEYS, EMOJI, CLIP, TOOLS, IMAGES }

              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private val KB_HEIGHT = 290 // dp

              private var red = Color.parseColor("#FF1744")
              private val blue = Color.parseColor("#5CC8FF")
              private var palette = 1 // 0 = red, 1 = red & blue, 2 = rainbow
              private val keyFill = Color.parseColor("#CC14141C")
              private val handler = Handler(Looper.getMainLooper())
              private val io = Executors.newSingleThreadExecutor()

              private class GlowKey(val d: GlowDrawable, val idx: Int)
              private val glowKeys = mutableListOf<GlowKey>()
              private var glowIdx = 0
              private var glowPhase = 0f
              private val glowAnimator = ValueAnimator.ofFloat(0f, 1f).apply {
                  duration = 2400
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener { glowPhase = it.animatedValue as Float; updateGlow() }
              }

              private lateinit var prefs: SharedPreferences
              private lateinit var store: ClipboardStore
              private lateinit var clipboard: ClipboardManager
              private lateinit var audio: AudioManager
              private lateinit var model: WordModel
              private var symPage = 1

              private var root: FrameLayout? = null
              private var bgView: ImageView? = null
              private var dimView: View? = null
              private var rgbBar: RgbBarView? = null
              private var suggestionRow: LinearLayout? = null
              private var body: LinearLayout? = null
              private var altPopup: PopupWindow? = null

              private var mode = Mode.KEYS
              private var shift = false
              private var caps = false
              private var lastShiftTap = 0L
              private var filipino = false
              private var symbols = false
              private var emojiCat = 0
              private var bgStamp = -1L
              private var oneHand = 0 // 0 = full, 1 = left, 2 = right
              private var allPhotos = false
              private var ignoreClipUntil = 0L

              private val ALTS = mapOf(
                  'a' to "àáâäãåā", 'e' to "èéêëēė", 'i' to "ìíîïī", 'o' to "òóôöõō",
                  'u' to "ùúûüū", 'n' to "ñ", 'c' to "ç", 's' to "ßś", 'y' to "ýÿ", 'z' to "žź",
                  '(' to "<[{", ')' to ">]}", '-' to "–—", '/' to "\\|", '*' to "×†",
                  '!' to "¡", '?' to "¿", '"' to "“”«»", '\'' to "‘’", '$' to "¢£€¥",
                  '&' to "§", '+' to "±", '=' to "≠≈", '%' to "‰°", '0' to "°"
              )

              private val clipListener = ClipboardManager.OnPrimaryClipChangedListener {
                  if (SystemClock.uptimeMillis() < ignoreClipUntil) return@OnPrimaryClipChangedListener
                  val clip = clipboard.primaryClip ?: return@OnPrimaryClipChangedListener
                  if (clip.itemCount == 0) return@OnPrimaryClipChangedListener
                  // Skip content the source app flags as sensitive (e.g. password managers)
                  if (Build.VERSION.SDK_INT >= 28 &&
                      clip.description.extras?.getBoolean("android.content.extra.IS_SENSITIVE") == true)
                      return@OnPrimaryClipChangedListener
                  val item = clip.getItemAt(0)
                  val desc = clip.description
                  val imgMime = (0 until desc.mimeTypeCount).map { desc.getMimeType(it) }
                      .firstOrNull { it.startsWith("image/") }
                  val uri = item.uri
                  if (uri != null && imgMime != null) {
                      var ext = imgMime.substringAfter('/').replace("jpeg", "jpg")
                      if (ext !in listOf("png", "jpg", "gif", "webp")) ext = "png"
                      val name = "clip_${System.currentTimeMillis()}.$ext"
                      if (ImageShare.copyToShared(this, uri, name) != null) store.add("IMG:$name")
                  } else {
                      store.add(item.coerceToText(this).toString())
                  }
                  if (mode == Mode.CLIP) render()
              }

              // ---------------------------------------------------------------- lifecycle

              override fun onCreate() {
                  super.onCreate()
                  prefs = getSharedPreferences("kb", Context.MODE_PRIVATE)
                  store = ClipboardStore(this)
                  audio = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  model = WordModel(this, EN_WORDS, FIL_WORDS)
                  io.execute { model.load() }
                  clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  clipboard.addPrimaryClipChangedListener(clipListener)
              }

              override fun onDestroy() {
                  model.save()
                  glowAnimator.cancel()
                  io.shutdown()
                  clipboard.removePrimaryClipChangedListener(clipListener)
                  super.onDestroy()
              }

              override fun onEvaluateFullscreenMode() = false

              override fun onCreateInputView(): View {
                  val frame = FixedHeightFrame(this) { kbHeight() }.apply {
                      setBackgroundColor(Color.parseColor("#0B0B10"))
                  }
                  root = frame
                  bgView = ImageView(this).apply { scaleType = ImageView.ScaleType.CENTER_CROP }
                  dimView = View(this)
                  frame.addView(bgView, FrameLayout.LayoutParams(MATCH, MATCH))
                  frame.addView(dimView, FrameLayout.LayoutParams(MATCH, MATCH))

                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  rgbBar = RgbBarView(this)
                  col.addView(rgbBar, LinearLayout.LayoutParams(MATCH, dp(4)))
                  suggestionRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  col.addView(suggestionRow, LinearLayout.LayoutParams(MATCH, dp(38)))
                  body = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(body, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  frame.addView(col, FrameLayout.LayoutParams(MATCH, MATCH))

                  applyPrefs()
                  render()
                  return frame
              }

              override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  mode = Mode.KEYS
                  symbols = false
                  caps = false
                  shift = info != null && (currentInputConnection?.getCursorCapsMode(info.inputType) ?: 0) != 0
                  applyPrefs()
                  render()
                  if (!restarting && animationsOn()) {
                      root?.apply {
                          alpha = 0f
                          translationY = dp(28).toFloat()
                          animate().alpha(1f).translationY(0f).setDuration(180).start()
                      }
                  }
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  root?.requestLayout()
                  render()
              }

              override fun onFinishInputView(finishingInput: Boolean) {
                  model.save()
                  glowAnimator.cancel()
                  dismissAlt()
                  super.onFinishInputView(finishingInput)
              }

              override fun onUpdateSelection(
                  oldSelStart: Int, oldSelEnd: Int, newSelStart: Int, newSelEnd: Int,
                  candidatesStart: Int, candidatesEnd: Int
              ) {
                  super.onUpdateSelection(
                      oldSelStart, oldSelEnd, newSelStart, newSelEnd, candidatesStart, candidatesEnd
                  )
                  if (mode == Mode.KEYS) updateSuggestions()
              }

              // ---------------------------------------------------------------- prefs / background

              private fun animationsOn() = prefs.getBoolean("anim", true)

              private fun applyPrefs() {
                  red = prefs.getInt("accent", Color.parseColor("#FF1744"))
                  palette = prefs.getInt("palette", 1)
                  oneHand = prefs.getInt("onehand", 0)
                  rgbBar?.setPalette(red, palette)
                  if (prefs.getBoolean("rgb", true) && animationsOn()) {
                      if (!glowAnimator.isRunning) glowAnimator.start()
                  } else {
                      glowAnimator.cancel()
                  }
                  rgbBar?.visibility = if (prefs.getBoolean("rgb", true)) View.VISIBLE else View.INVISIBLE
                  rgbBar?.setAnimated(prefs.getBoolean("rgb", true) && animationsOn())
                  dimView?.setBackgroundColor(Color.argb(prefs.getInt("dim", 160), 0, 0, 0))
                  val f = File(filesDir, "background.jpg")
                  if (f.exists()) {
                      if (f.lastModified() != bgStamp) {
                          bgStamp = f.lastModified()
                          bgView?.setImageBitmap(BitmapFactory.decodeFile(f.path))
                      }
                  } else if (bgStamp != 0L) {
                      bgStamp = 0L
                      bgView?.setImageDrawable(null)
                  }
              }

              // ---------------------------------------------------------------- rendering

              private fun render() {
                  val b = body ?: return
                  dismissAlt()
                  b.removeAllViews()
                  glowKeys.clear()
                  glowIdx = 0
                  val side = (resources.displayMetrics.widthPixels * 0.2f).toInt()
                  b.setPadding(
                      dp(3) + if (oneHand == 2) side else 0, 0,
                      dp(3) + if (oneHand == 1) side else 0, dp(4)
                  )
                  if (!symbols) symPage = 1
                  suggestionRow?.layoutParams?.height = dp(if (isLandscape()) 30 else 38)
                  suggestionRow?.visibility = if (mode == Mode.KEYS) View.VISIBLE else View.GONE
                  when (mode) {
                      Mode.KEYS -> buildKeys(b)
                      Mode.EMOJI -> buildEmoji(b)
                      Mode.CLIP -> buildClip(b)
                      Mode.TOOLS -> buildTools(b)
                      Mode.IMAGES -> buildImages(b)
                  }
                  updateSuggestions()
              }

              private fun buildKeys(b: LinearLayout) {
                  b.addView(row { "1234567890".forEach { add(charKey(it)) } }, rowLp())

                  if (symbols) {
                      if (symPage == 1) {
                          b.addView(row { "@#\$_&-+()/".forEach { add(charKey(it)) } }, rowLp())
                          b.addView(row {
                              add(key("=\\<", 1.5f, textSize = 14f) { symPage = 2; render() })
                              "*\"':;!?".forEach { add(charKey(it)) }
                              add(deleteKey())
                          }, rowLp())
                      } else {
                          b.addView(row { "~`|•√π÷×¶∆".forEach { add(charKey(it)) } }, rowLp())
                          b.addView(row {
                              add(key("?123", 1.5f, textSize = 14f) { symPage = 1; render() })
                              "£₱€¥%^=".forEach { add(charKey(it)) }
                              add(deleteKey())
                          }, rowLp())
                      }
                  } else {
                      b.addView(row { "qwertyuiop".forEach { add(charKey(it)) } }, rowLp())
                      if (filipino) {
                          b.addView(row { "asdfghjklñ".forEach { add(charKey(it)) } }, rowLp())
                      } else {
                          b.addView(row {
                              add(spacer(0.5f))
                              "asdfghjkl".forEach { add(charKey(it)) }
                              add(spacer(0.5f))
                          }, rowLp())
                      }
                      b.addView(row {
                          add(key(if (caps) "⇪" else "⇧", 1.5f, accent = shift || caps) { onShift() })
                          "zxcvbnm".forEach { add(charKey(it)) }
                          add(deleteKey())
                      }, rowLp())
                  }

                  b.addView(row {
                      add(key(if (symbols) "ABC" else "?123", 1.3f, textSize = 14f) {
                          symbols = !symbols; symPage = 1; render()
                      })
                      add(key(",", 0.9f) { type(",") })
                      add(key("😊", 0.9f) { mode = Mode.EMOJI; render() })
                      add(key("📋", 0.9f) { mode = Mode.CLIP; render() })
                      add(key(if (filipino) "FIL" else "EN", 1f, textSize = 13f) {
                          filipino = !filipino; render()
                      })
                      add(key(if (filipino) "Custom · FIL" else "Custom · EN", 2.8f, textSize = 12f, glow = true) { type(" ") })
                      add(key(".", 0.9f, alts = ",?!'\":;-") { type(".") })
                      add(key("⏎", 1.3f, accent = true) { onEnter() })
                  }, rowLp())
              }

              private fun buildTools(b: LinearLayout) {
                  b.addView(row {
                      add(key("🖼\nImages", 1f, textSize = 13f) { mode = Mode.IMAGES; render() })
                      add(key("📋\nClipboard", 1f, textSize = 13f) { mode = Mode.CLIP; render() })
                      add(key("😊\nEmoji", 1f, textSize = 13f) { mode = Mode.EMOJI; render() })
                      add(key("⚙\nSettings", 1f, textSize = 13f) { openSettings() })
                  }, rowLp())
                  b.addView(row {
                      add(key("Select\nall", 1f, textSize = 13f) { menuAction(android.R.id.selectAll) })
                      add(key("Cut", 1f, textSize = 14f) { menuAction(android.R.id.cut) })
                      add(key("Copy", 1f, textSize = 14f) { menuAction(android.R.id.copy) })
                      add(key("Paste", 1f, textSize = 14f) { menuAction(android.R.id.paste) })
                  }, rowLp())
                  b.addView(row {
                      add(key("◀", 1f, repeat = true) { sendDownUpKeyEvents(KeyEvent.KEYCODE_DPAD_LEFT) })
                      add(key("▶", 1f, repeat = true) { sendDownUpKeyEvents(KeyEvent.KEYCODE_DPAD_RIGHT) })
                      add(key("◧\nLeft hand", 1f, accent = oneHand == 1, textSize = 12f) { setOneHand(1) })
                      add(key("◨\nRight hand", 1f, accent = oneHand == 2, textSize = 12f) { setOneHand(2) })
                  }, rowLp())
                  val soundOn = prefs.getBoolean("sound", false)
                  b.addView(row {
                      add(key("Full\nwidth", 1f, accent = oneHand == 0, textSize = 12f) { setOneHand(0) })
                      add(key(if (soundOn) "🔊\nSound on" else "🔇\nSound off", 1f, textSize = 12f) {
                          prefs.edit().putBoolean("sound", !soundOn).apply(); render()
                      })
                      add(key("ABC", 2f, accent = true, textSize = 15f) { mode = Mode.KEYS; render() })
                  }, rowLp())
              }

              private fun buildImages(b: LinearLayout) {
                  b.addView(row {
                      add(key("📸 Screenshots", 2f, accent = !allPhotos, textSize = 12f) { allPhotos = false; render() })
                      add(key("🖼 Recent", 2f, accent = allPhotos, textSize = 12f) { allPhotos = true; render() })
                  }, LinearLayout.LayoutParams(MATCH, hdp(44)))

                  val bottom = row {
                      add(key("ABC", 1.5f, textSize = 14f) { mode = Mode.KEYS; render() })
                      add(spacer(4f))
                  }

                  if (!hasMediaPermission()) {
                      b.addView(TextView(this).apply {
                          text = "Allow photo access to send screenshots from here."
                          setTextColor(Color.LTGRAY)
                          gravity = Gravity.CENTER
                      }, LinearLayout.LayoutParams(MATCH, 0, 1f))
                      bottom.addView(key("Open settings", 3f, accent = true, textSize = 13f) { openSettings() })
                      b.addView(bottom, LinearLayout.LayoutParams(MATCH, hdp(46)))
                      return
                  }

                  val uris = recentImages(allPhotos, 24)
                  if (uris.isEmpty()) {
                      b.addView(TextView(this).apply {
                          text = if (allPhotos) "No photos found." else "No screenshots found."
                          setTextColor(Color.LTGRAY)
                          gravity = Gravity.CENTER
                      }, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  } else {
                      val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                      uris.chunked(4).forEach { chunk ->
                          val r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                          for (i in 0 until 4) {
                              val uri = chunk.getOrNull(i)
                              val iv = ImageView(this).apply {
                                  scaleType = ImageView.ScaleType.CENTER_CROP
                                  setBackgroundColor(Color.parseColor("#22FFFFFF"))
                                  if (uri != null) setOnClickListener { pop(it); sendImage(uri) }
                              }
                              if (uri != null) {
                                  io.execute {
                                      val bm = decodeThumb(uri, 260)
                                      if (bm != null) handler.post { iv.setImageBitmap(bm) }
                                  }
                              } else {
                                  iv.setBackgroundColor(Color.TRANSPARENT)
                              }
                              r.addView(iv, LinearLayout.LayoutParams(0, hdp(78), 1f).apply {
                                  setMargins(dp(2), dp(2), dp(2), dp(2))
                              })
                          }
                          list.addView(r)
                      }
                      b.addView(ScrollView(this).apply { addView(list) }, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  }
                  b.addView(bottom, LinearLayout.LayoutParams(MATCH, hdp(46)))
              }

              private fun buildEmoji(b: LinearLayout) {
                  val tabs = row {
                      EMOJI.forEachIndexed { i, cat ->
                          add(key(cat.first, 1f, accent = i == emojiCat) { emojiCat = i; render() })
                      }
                  }
                  b.addView(tabs, LinearLayout.LayoutParams(MATCH, hdp(44)))

                  val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  EMOJI[emojiCat].second.chunked(8).forEach { chunk ->
                      val r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      for (i in 0 until 8) {
                          val e = chunk.getOrNull(i)
                          val tv = TextView(this).apply {
                              text = e ?: ""
                              textSize = 24f
                              gravity = Gravity.CENTER
                              if (e != null) setOnClickListener {
                                  it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                  pop(it)
                                  currentInputConnection?.commitText(e, 1)
                              }
                          }
                          r.addView(tv, LinearLayout.LayoutParams(0, hdp(46), 1f))
                      }
                      list.addView(r)
                  }
                  b.addView(ScrollView(this).apply { addView(list) }, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  b.addView(row {
                      add(key("ABC", 1.5f, textSize = 14f) { mode = Mode.KEYS; render() })
                      add(spacer(5f))
                      add(deleteKey(1.5f))
                  }, LinearLayout.LayoutParams(MATCH, hdp(46)))
              }

              private fun buildClip(b: LinearLayout) {
                  b.addView(row {
                      add(TextView(this@CustomKeyboardService).apply {
                          text = "  CLIPBOARD"
                          setTextColor(red)
                          textSize = 13f
                          gravity = Gravity.CENTER_VERTICAL
                          typeface = Typeface.DEFAULT_BOLD
                      }.also { it.layoutParams = LinearLayout.LayoutParams(0, MATCH, 4f) })
                      add(key("Clear", 1.3f, textSize = 13f) { store.clear(); render() })
                  }, LinearLayout.LayoutParams(MATCH, hdp(44)))

                  val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val items = store.all()
                  if (items.isEmpty()) {
                      list.addView(TextView(this).apply {
                          text = "Nothing copied yet.\nCopy text or an image and it shows up here."
                          setTextColor(Color.LTGRAY)
                          gravity = Gravity.CENTER
                          setPadding(dp(8), dp(24), dp(8), dp(8))
                      })
                  }
                  items.forEach { clip ->
                      if (clip.startsWith("IMG:")) {
                          val f = File(ImageShare.dir(this), clip.removePrefix("IMG:"))
                          val iv = ImageView(this).apply {
                              scaleType = ImageView.ScaleType.CENTER_INSIDE
                              background = keyDrawable(false, false)
                              setPadding(dp(4), dp(4), dp(4), dp(4))
                              setOnClickListener { pop(it); sendLocalImage(f) }
                              setOnLongClickListener { store.remove(clip); render(); true }
                          }
                          io.execute {
                              val bm = decodeThumb(Uri.fromFile(f), 400)
                              if (bm != null) handler.post { iv.setImageBitmap(bm) }
                          }
                          list.addView(iv, LinearLayout.LayoutParams(MATCH, hdp(96))
                              .apply { setMargins(dp(2), dp(2), dp(2), dp(2)) })
                      } else {
                          val tv = TextView(this).apply {
                              text = clip
                              maxLines = 2
                              ellipsize = TextUtils.TruncateAt.END
                              setTextColor(Color.WHITE)
                              textSize = 14f
                              setPadding(dp(12), dp(8), dp(12), dp(8))
                              background = keyDrawable(false, false)
                              setOnClickListener {
                                  it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                  pop(it)
                                  currentInputConnection?.commitText(clip, 1)
                              }
                              setOnLongClickListener { store.remove(clip); render(); true }
                          }
                          list.addView(tv, LinearLayout.LayoutParams(MATCH, ViewGroup.LayoutParams.WRAP_CONTENT)
                              .apply { setMargins(dp(2), dp(2), dp(2), dp(2)) })
                      }
                  }
                  b.addView(ScrollView(this).apply { addView(list) }, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  b.addView(row {
                      add(key("ABC", 1.5f, textSize = 14f) { mode = Mode.KEYS; render() })
                      add(TextView(this@CustomKeyboardService).apply {
                          text = "tap to paste · hold to delete"
                          setTextColor(Color.GRAY)
                          textSize = 11f
                          gravity = Gravity.CENTER
                      }.also { it.layoutParams = LinearLayout.LayoutParams(0, MATCH, 5f) })
                      add(deleteKey(1.5f))
                  }, LinearLayout.LayoutParams(MATCH, hdp(46)))
              }

              // ---------------------------------------------------------------- key factory

              private fun row(build: LinearLayout.() -> Unit): LinearLayout =
                  LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; build() }

              private fun rowLp() = LinearLayout.LayoutParams(MATCH, 0, 1f)

              private fun LinearLayout.add(v: View) = addView(v)

              private fun spacer(weight: Float) = View(this).apply {
                  layoutParams = LinearLayout.LayoutParams(0, MATCH, weight)
              }

              private fun charKey(c: Char): View {
                  val label = if (c.isLetter() && (shift || caps)) c.uppercaseChar().toString() else c.toString()
                  return key(label, alts = ALTS[c]) { type(c.toString()) }
              }

              private fun deleteKey(weight: Float = 1.5f) =
                  key("⌫", weight, repeat = true) { deleteBackward() }

              /** Plain rounded drawable for cards and popups. */
              private fun keyDrawable(accent: Boolean, pressed: Boolean) = GradientDrawable().apply {
                  cornerRadius = dp(9).toFloat()
                  setColor(if (pressed) red else if (accent) ColorUtils.setAlphaComponent(red, 110) else keyFill)
                  setStroke(dp(1), ColorUtils.setAlphaComponent(red, 150))
              }

              private fun pressColor() = if (palette == 1) blue else red

              private fun keyBg(accent: Boolean, pressed: Boolean, big: Boolean): GlowDrawable {
                  val g = GlowDrawable(dp(9).toFloat(), resources.displayMetrics.density * if (isLandscape()) 0.7f else 1f)
                  g.fill = when {
                      pressed -> pressColor()
                      accent -> ColorUtils.setAlphaComponent(if (palette == 1) blue else red, 120)
                      else -> keyFill
                  }
                  g.edge = if (pressed) Color.WHITE else glowColor(0)
                  g.strength = if (big) 1.7f else 1f
                  return g
              }

              /** Animated RGB glow colour: a wave that flows across the keys. */
              private fun glowColor(i: Int): Int {
                  val t = glowPhase + i * 0.03f
                  val wave = (sin(t * 2 * PI) * 0.5 + 0.5).toFloat()
                  return when (palette) {
                      2 -> Color.HSVToColor(255, floatArrayOf((t * 360f) % 360f, 0.9f, 1f))
                      1 -> ColorUtils.blendARGB(red, blue, wave)
                      else -> {
                          val hsv = FloatArray(3)
                          Color.colorToHSV(red, hsv)
                          hsv[1] = (0.45f + 0.55f * wave).coerceIn(0f, 1f)
                          hsv[2] = 0.65f + 0.35f * wave
                          Color.HSVToColor(255, hsv)
                      }
                  }
              }

              private fun updateGlow() {
                  for (g in glowKeys) {
                      g.d.edge = glowColor(g.idx)
                      g.d.invalidateSelf()
                  }
              }

              private fun key(
                  label: String,
                  weight: Float = 1f,
                  accent: Boolean = false,
                  repeat: Boolean = false,
                  textSize: Float = 18f,
                  glow: Boolean = false,
                  alts: String? = null,
                  onTap: () -> Unit
              ): TextView {
                  val tv = TextView(this)
                  tv.text = label
                  tv.gravity = Gravity.CENTER
                  tv.setTextColor(Color.WHITE)
                  tv.textSize = textSize
                  tv.typeface = Typeface.DEFAULT_BOLD
                  tv.setShadowLayer(dp(5).toFloat(), 0f, 0f,
                      ColorUtils.setAlphaComponent(if (palette == 1) blue else red, 220))

                  val base = keyBg(accent || glow, false, glow)
                  val idx = glowIdx++
                  base.edge = glowColor(idx)
                  glowKeys.add(GlowKey(base, idx))
                  tv.background = base
                  tv.layoutParams = LinearLayout.LayoutParams(0, MATCH, weight)
                      .apply { setMargins(dp(2), dp(2), dp(2), dp(2)) }

                  val repeater = object : Runnable {
                      override fun run() { onTap(); handler.postDelayed(this, 45) }
                  }
                  var longFired = false
                  val longPress = Runnable {
                      longFired = true
                      if (alts != null) showAlts(tv, alts)
                  }
                  fun release(v: View) {
                      v.background = base
                      if (animationsOn()) {
                          v.animate().scaleX(1f).scaleY(1f).setDuration(140)
                              .setInterpolator(OvershootInterpolator(3f)).start()
                      }
                  }

                  tv.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              longFired = false
                              v.background = keyBg(accent || glow, true, glow)
                              if (animationsOn()) v.animate().scaleX(0.9f).scaleY(0.9f).setDuration(60).start()
                              v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                              if (prefs.getBoolean("sound", false)) audio.playSoundEffect(AudioManager.FX_KEYPRESS_STANDARD)
                              if (alts != null) {
                                  handler.postDelayed(longPress, 380)
                              } else {
                                  onTap()
                                  if (repeat) handler.postDelayed(repeater, 380)
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              handler.removeCallbacks(longPress)
                              handler.removeCallbacks(repeater)
                              if (alts != null && !longFired) onTap()
                              release(v)
                          }
                          MotionEvent.ACTION_CANCEL -> {
                              handler.removeCallbacks(longPress)
                              handler.removeCallbacks(repeater)
                              release(v)
                          }
                      }
                      true
                  }
                  return tv
              }

              private fun pop(v: View) {
                  if (!animationsOn()) return
                  v.animate().scaleX(0.8f).scaleY(0.8f).setDuration(60).withEndAction {
                      v.animate().scaleX(1f).scaleY(1f).setDuration(140)
                          .setInterpolator(OvershootInterpolator(3f)).start()
                  }.start()
              }

              // ---------------------------------------------------------------- long-press alternates

              private fun showAlts(anchor: View, alts: String) {
                  dismissAlt()
                  val rowView = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      background = GradientDrawable().apply {
                          cornerRadius = dp(10).toFloat()
                          setColor(Color.parseColor("#14141C"))
                          setStroke(dp(2), red)
                      }
                      setPadding(dp(4), dp(4), dp(4), dp(4))
                  }
                  alts.forEach { ch ->
                      rowView.addView(TextView(this).apply {
                          text = ch.toString()
                          textSize = 22f
                          setTextColor(Color.WHITE)
                          gravity = Gravity.CENTER
                          setOnClickListener { type(ch.toString()); dismissAlt() }
                      }, LinearLayout.LayoutParams(dp(40), hdp(44)))
                  }
                  val pw = PopupWindow(rowView, ViewGroup.LayoutParams.WRAP_CONTENT, dp(54))
                  pw.isOutsideTouchable = true
                  pw.isFocusable = false
                  altPopup = pw
                  try {
                      pw.showAsDropDown(anchor, 0, -(anchor.height + dp(54)))
                  } catch (e: Exception) {
                      altPopup = null
                  }
              }

              private fun dismissAlt() {
                  altPopup?.dismiss()
                  altPopup = null
              }

              // ---------------------------------------------------------------- input actions

              private fun type(s: String) {
                  if (s.length == 1 && (s[0].isWhitespace() || s[0] in ".,!?;:)\"")) learnBeforeCursor()
                  val out = if (shift || caps) s.uppercase() else s
                  currentInputConnection?.commitText(out, 1)
                  if (shift && !caps) { shift = false; render() } else updateSuggestions()
              }

              private fun deleteBackward() {
                  val ic = currentInputConnection ?: return
                  if (!ic.getSelectedText(0).isNullOrEmpty()) ic.commitText("", 1)
                  else sendDownUpKeyEvents(KeyEvent.KEYCODE_DEL)
              }

              private fun menuAction(id: Int) {
                  currentInputConnection?.performContextMenuAction(id)
              }

              private fun onShift() {
                  val now = SystemClock.uptimeMillis()
                  when {
                      caps -> { caps = false; shift = false }
                      shift && now - lastShiftTap < 350 -> caps = true
                      else -> shift = !shift
                  }
                  lastShiftTap = now
                  render()
              }

              private fun onEnter() {
                  learnBeforeCursor()
                  val ei = currentInputEditorInfo
                  val action = ei?.imeOptions?.and(EditorInfo.IME_MASK_ACTION) ?: EditorInfo.IME_ACTION_NONE
                  val noAction = ei == null ||
                      (ei.imeOptions and EditorInfo.IME_FLAG_NO_ENTER_ACTION) != 0 ||
                      action == EditorInfo.IME_ACTION_NONE || action == EditorInfo.IME_ACTION_UNSPECIFIED
                  if (noAction) sendDownUpKeyEvents(KeyEvent.KEYCODE_ENTER)
                  else currentInputConnection?.performEditorAction(action)
              }

              private fun setOneHand(v: Int) {
                  oneHand = v
                  prefs.edit().putInt("onehand", v).apply()
                  mode = Mode.KEYS
                  render()
              }

              private fun openSettings() {
                  startActivity(Intent(this, SettingsActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_LONG).show()

              // ---------------------------------------------------------------- images

              private fun hasMediaPermission(): Boolean {
                  val perm = if (Build.VERSION.SDK_INT >= 33) android.Manifest.permission.READ_MEDIA_IMAGES
                  else android.Manifest.permission.READ_EXTERNAL_STORAGE
                  return checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED
              }

              private fun recentImages(all: Boolean, limit: Int): List<Uri> {
                  val out = mutableListOf<Uri>()
                  val media = MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                  val sel = if (all) null else
                      "${MediaStore.Images.Media.BUCKET_DISPLAY_NAME} LIKE ? OR ${MediaStore.Images.Media.DISPLAY_NAME} LIKE ?"
                  val args = if (all) null else arrayOf("%creenshot%", "%creenshot%")
                  try {
                      contentResolver.query(
                          media, arrayOf(MediaStore.Images.Media._ID), sel, args,
                          "${MediaStore.Images.Media.DATE_ADDED} DESC"
                      )?.use { c ->
                          val idCol = c.getColumnIndexOrThrow(MediaStore.Images.Media._ID)
                          while (c.moveToNext() && out.size < limit) {
                              out.add(ContentUris.withAppendedId(media, c.getLong(idCol)))
                          }
                      }
                  } catch (e: Exception) {
                  }
                  return out
              }

              private fun decodeThumb(uri: Uri, max: Int): Bitmap? = try {
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, o) }
                  var s = 1
                  while (o.outWidth / (s * 2) >= max && o.outHeight / (s * 2) >= max) s *= 2
                  contentResolver.openInputStream(uri)?.use {
                      BitmapFactory.decodeStream(it, null, BitmapFactory.Options().apply { inSampleSize = s })
                  }
              } catch (e: Exception) {
                  null
              }

              /** Sends an image from the gallery/screenshots to the focused app. */
              private fun sendImage(src: Uri) {
                  io.execute {
                      val mime = contentResolver.getType(src) ?: "image/png"
                      var ext = mime.substringAfter('/').replace("jpeg", "jpg")
                      if (ext !in listOf("png", "jpg", "gif", "webp")) ext = "png"
                      val shared = ImageShare.copyToShared(this, src, "send_${System.currentTimeMillis()}.$ext")
                      handler.post {
                          if (shared == null) toast("Couldn't read that image") else deliver(shared, mime)
                      }
                  }
              }

              private fun sendLocalImage(f: File) {
                  if (!f.exists()) { toast("That image is no longer available"); return }
                  val uri = FileProvider.getUriForFile(this, ImageShare.AUTH, f)
                  val ext = f.extension.lowercase()
                  deliver(uri, "image/" + if (ext == "jpg") "jpeg" else ext)
              }

              private fun deliver(uri: Uri, mime: String) {
                  if (ImageShare.send(this, uri, mime)) return
                  // The app doesn't take images from keyboards: copy it so the user can paste manually.
                  ignoreClipUntil = SystemClock.uptimeMillis() + 1500
                  clipboard.setPrimaryClip(ClipData.newUri(contentResolver, "Image", uri))
                  toast("This app can't take images from the keyboard. Image copied: long-press the text box and tap Paste.")
              }

              // ---------------------------------------------------------------- suggestions

              private fun isPasswordField(): Boolean {
                  val t = currentInputEditorInfo?.inputType ?: return false
                  val cls = t and InputType.TYPE_MASK_CLASS
                  val v = t and InputType.TYPE_MASK_VARIATION
                  return (cls == InputType.TYPE_CLASS_TEXT && (v == InputType.TYPE_TEXT_VARIATION_PASSWORD ||
                      v == InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD ||
                      v == InputType.TYPE_TEXT_VARIATION_WEB_PASSWORD)) ||
                      (cls == InputType.TYPE_CLASS_NUMBER && v == InputType.TYPE_NUMBER_VARIATION_PASSWORD)
              }

              /** The word being typed, and the word before it (if separated by a space). */
              private fun wordContext(): Pair<String, String> {
                  val before = currentInputConnection?.getTextBeforeCursor(60, 0)?.toString().orEmpty()
                  val word = before.takeLastWhile { it.isLetter() || it == '\'' }
                  val rest = before.dropLast(word.length)
                  val prev = if (rest.isNotEmpty() && rest.last().isWhitespace())
                      rest.trimEnd().takeLastWhile { it.isLetter() || it == '\'' } else ""
                  return word to prev
              }

              private fun learnBeforeCursor() {
                  if (isPasswordField()) return
                  val (w, p) = wordContext()
                  if (w.length >= 2) model.learn(w, p)
              }

              private fun pick(s: String, word: String, prev: String) {
                  val ic = currentInputConnection ?: return
                  ic.deleteSurroundingText(word.length, 0)
                  ic.commitText("$s ", 1)
                  model.learn(s, prev)
                  if (shift && !caps) { shift = false; render() } else updateSuggestions()
              }

              private fun updateSuggestions() {
                  val row = suggestionRow ?: return
                  row.removeAllViews()
                  if (mode != Mode.KEYS) return

                  row.addView(TextView(this).apply {
                      text = "⋯"
                      textSize = 24f
                      setTextColor(if (palette == 1) blue else red)
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setOnClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                          mode = Mode.TOOLS
                          render()
                      }
                  }, LinearLayout.LayoutParams(dp(52), MATCH))
                  if (isPasswordField()) return

                  val (word, prev) = wordContext()
                  val raw = model.suggest(word, prev, filipino, 3)
                  val allCaps = word.length > 1 && word.all { !it.isLetter() || it.isUpperCase() }
                  val cap = word.firstOrNull()?.isUpperCase() == true || (word.isEmpty() && shift)
                  val list = raw.map { s ->
                      when {
                          allCaps -> s.uppercase()
                          cap -> s.replaceFirstChar { it.uppercase() }
                          else -> s
                      }
                  }
                  // Best suggestion in the middle, like Gboard
                  for (pos in 0..2) {
                      val s = when (pos) {
                          0 -> list.getOrNull(1)
                          1 -> list.getOrNull(0)
                          else -> list.getOrNull(2)
                      }
                      row.addView(View(this).apply { setBackgroundColor(Color.argb(90, 255, 23, 68)) },
                          LinearLayout.LayoutParams(dp(1), dp(18)))
                      row.addView(TextView(this).apply {
                          text = s ?: ""
                          setTextColor(Color.WHITE)
                          textSize = 15f
                          gravity = Gravity.CENTER
                          if (pos == 1) typeface = Typeface.DEFAULT_BOLD
                          if (s != null) setOnClickListener { pick(s, word, prev) }
                      }, LinearLayout.LayoutParams(0, MATCH, 1f))
                  }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun isLandscape() =
                  resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE

              /** Panel sizes shrink in landscape so the keyboard doesn't cover the screen. */
              private fun hdp(v: Int) = (dp(v) * if (isLandscape()) 0.72f else 1f).toInt()

              private fun kbHeight(): Int {
                  val h = resources.displayMetrics.heightPixels
                  return if (isLandscape()) minOf(dp(KB_HEIGHT), (h * 0.58f).toInt()) else dp(KB_HEIGHT)
              }

