          package com.example.customkeyboard

          import android.content.Context
          import java.util.Collections
          import java.util.PriorityQueue
          import kotlin.math.abs

          /**
           * Word prediction: big frequency dictionaries (from app assets when present),
           * plus words and word pairs learned from what the user types.
           */
          class WordModel(
              private val ctx: Context,
              private val builtinEn: List<String>,
              private val builtinFil: List<String>
          ) {
              private class Dict(val words: Array<String>) {
                  private val sorted: Array<String>
                  private val rankOf: IntArray

                  init {
                      val idx = words.indices.sortedBy { words[it] }
                      sorted = Array(idx.size) { words[idx[it]] }
                      rankOf = IntArray(idx.size) { idx[it] }
                  }

                  /** Ranks (0 = most common) of the best words starting with [p]. */
                  fun complete(p: String, limit: Int): List<Int> {
                      var lo = 0
                      var hi = sorted.size
                      while (lo < hi) {
                          val mid = (lo + hi) ushr 1
                          if (sorted[mid] < p) lo = mid + 1 else hi = mid
                      }
                      val best = PriorityQueue<Int>(limit + 1, Collections.reverseOrder<Int>())
                      var i = lo
                      while (i < sorted.size && sorted[i].startsWith(p)) {
                          if (sorted[i] != p) {
                              best.add(rankOf[i])
                              if (best.size > limit) best.poll()
                          }
                          i++
                      }
                      return best.sorted()
                  }

                  /** Common words one typo away from [p] (substitution, missing/extra letter, swap). */
                  fun fuzzy(p: String, limit: Int): List<Int> {
                      val out = ArrayList<Int>()
                      for (r in words.indices) {
                          val w = words[r]
                          if (abs(w.length - p.length) <= 1 && near(w, p)) {
                              out.add(r)
                              if (out.size >= limit) break
                          }
                      }
                      return out
                  }
              }

              @Volatile private var en = Dict(builtinEn.map { it.lowercase() }.toTypedArray())
              @Volatile private var fil = Dict(builtinFil.map { it.lowercase() }.toTypedArray())

              private val prefs = ctx.getSharedPreferences("words", Context.MODE_PRIVATE)
              private val user = HashMap<String, Int>()
              private val next = HashMap<String, HashMap<String, Int>>()
              private var dirty = false

              init { loadUser() }

              /** Call off the main thread: reads the large dictionaries if they were bundled. */
              fun load() {
                  readDict("en_50k.txt", 30000, BLOCK_EN)?.let { en = it }
                  readDict("tl_50k.txt", 20000, BLOCK_FIL)?.let { fil = it }
              }

              private fun readDict(asset: String, max: Int, block: Set<String>): Dict? = try {
                  val out = ArrayList<String>()
                  ctx.assets.open(asset).bufferedReader().useLines { lines ->
                      for (ln in lines) {
                          val w = ln.substringBefore(' ').trim().lowercase()
                          if ((w.length >= 2 || w == "a" || w == "i") && w.length <= 20 &&
                              w.all { it.isLetter() || it == '\'' } && w !in block
                          ) out.add(w)
                          if (out.size >= max) break
                      }
                  }
                  if (out.size < 500) null else Dict(out.distinct().toTypedArray())
              } catch (e: Exception) {
                  null
              }

              fun suggest(prefix: String, prev: String, filipino: Boolean, limit: Int): List<String> {
                  val p = prefix.lowercase()
                  if (p.isEmpty()) return nextWords(prev.lowercase(), filipino, limit)

                  val scores = HashMap<String, Double>()
                  for ((w, c) in user) {
                      if (c >= 2 && w.length > p.length && w.startsWith(p)) scores[w] = 200000.0 + c
                  }
                  val primary = if (filipino) fil else en
                  val secondary = if (filipino) en else fil
                  for (r in primary.complete(p, 6)) {
                      val w = primary.words[r]
                      scores[w] = maxOf(scores[w] ?: 0.0, 100000.0 - r)
                  }
                  for (r in secondary.complete(p, 4)) {
                      val w = secondary.words[r]
                      scores[w] = maxOf(scores[w] ?: 0.0, 80000.0 - r)
                  }
                  var out = scores.entries.sortedByDescending { it.value }.map { it.key }.take(limit)
                  if (out.size < limit && p.length >= 3) {
                      val extra = primary.fuzzy(p, limit).map { primary.words[it] } +
                          secondary.fuzzy(p, 2).map { secondary.words[it] }
                      out = (out + extra.filter { it != p }).distinct().take(limit)
                  }
                  return out
              }

              private fun nextWords(prev: String, filipino: Boolean, limit: Int): List<String> {
                  val out = ArrayList<String>()
                  fun addWord(w: String) {
                      if (out.size < limit && out.none { it.equals(w, true) }) out.add(w)
                  }
                  if (prev.isNotEmpty()) {
                      next[prev]?.entries?.sortedByDescending { it.value }?.forEach { addWord(it.key) }
                      SEEDS[prev]?.forEach { addWord(it) }
                  }
                  val defaults = if (filipino) listOf("po", "opo", "salamat", "ako", "ikaw", "sige")
                  else listOf("I", "the", "and", "to", "you", "it")
                  defaults.forEach { addWord(it) }
                  return out
              }

              fun learn(word: String, prev: String) {
                  val w = word.lowercase()
                  if (w.length < 2) return
                  user[w] = (user[w] ?: 0) + 1
                  if (prev.isNotEmpty()) {
                      val m = next.getOrPut(prev.lowercase()) { HashMap() }
                      m[w] = (m[w] ?: 0) + 1
                  }
                  dirty = true
              }

              fun save() {
                  if (!dirty) return
                  dirty = false
                  val u = user.entries.sortedByDescending { it.value }.take(5000)
                      .joinToString("\n") { "${it.key}\t${it.value}" }
                  val n = ArrayList<Triple<String, String, Int>>()
                  for ((a, m) in next) for ((b, c) in m) n.add(Triple(a, b, c))
                  val ns = n.sortedByDescending { it.third }.take(6000)
                      .joinToString("\n") { "${it.first}\t${it.second}\t${it.third}" }
                  prefs.edit().putString("user", u).putString("next", ns).apply()
              }

              private fun loadUser() {
                  prefs.getString("user", "")?.lineSequence()?.forEach { ln ->
                      val p = ln.split('\t')
                      if (p.size == 2) p[1].toIntOrNull()?.let { user[p[0]] = it }
                  }
                  prefs.getString("next", "")?.lineSequence()?.forEach { ln ->
                      val p = ln.split('\t')
                      if (p.size == 3) p[2].toIntOrNull()?.let { next.getOrPut(p[0]) { HashMap() }[p[1]] = it }
                  }
              }

              companion object {
                  private fun near(a: String, b: String): Boolean {
                      if (a == b) return false
                      val la = a.length
                      val lb = b.length
                      if (abs(la - lb) > 1) return false
                      if (la == lb) {
                          var i = 0
                          while (i < la && a[i] == b[i]) i++
                          if (i == la) return false
                          if (a.substring(i + 1) == b.substring(i + 1)) return true
                          return i + 1 < la && a[i] == b[i + 1] && a[i + 1] == b[i] &&
                              a.substring(i + 2) == b.substring(i + 2)
                      }
                      val s = if (la < lb) a else b
                      val l = if (la < lb) b else a
                      var i = 0
                      while (i < s.length && s[i] == l[i]) i++
                      return s.substring(i) == l.substring(i + 1)
                  }

                  private val BLOCK_EN = setOf(
                      "fuck", "fucks", "fucked", "fucking", "fucker", "shit", "shitty", "bitch", "bitches",
                      "bastard", "asshole", "dick", "dicks", "pussy", "cock", "cunt", "whore", "slut",
                      "nigger", "nigga", "faggot", "fag", "retard", "retarded"
                  )
                  private val BLOCK_FIL = BLOCK_EN + setOf(
                      "putangina", "putang", "tangina", "puta", "tarantado", "kantot", "pakyu", "pokpok",
                      "burat", "puke", "titi", "bayag"
                  )

                  private val SEEDS = mapOf(
                      "i" to listOf("am", "have", "think", "don't"),
                      "thank" to listOf("you"),
                      "how" to listOf("are", "to", "do"),
                      "you" to listOf("are", "can", "know"),
                      "do" to listOf("you", "not", "i"),
                      "what" to listOf("is", "are", "do"),
                      "good" to listOf("morning", "night", "luck"),
                      "see" to listOf("you", "the"),
                      "in" to listOf("the", "a"),
                      "of" to listOf("the", "a"),
                      "to" to listOf("the", "be", "do"),
                      "it" to listOf("is", "was"),
                      "is" to listOf("it", "a", "the"),
                      "are" to listOf("you", "we"),
                      "will" to listOf("be", "do"),
                      "have" to listOf("a", "to", "been"),
                      "can" to listOf("you", "i"),
                      "let" to listOf("me", "us"),
                      "hello" to listOf("there", "po"),
                      "salamat" to listOf("po", "sa", "din"),
                      "kumusta" to listOf("ka", "na", "po"),
                      "magandang" to listOf("umaga", "gabi", "hapon"),
                      "ako" to listOf("ay", "po", "na"),
                      "hindi" to listOf("ko", "po", "na"),
                      "sige" to listOf("po", "na", "lang"),
                      "ikaw" to listOf("ba", "na", "ang"),
                      "ano" to listOf("ba", "po", "ang"),
                      "ingat" to listOf("po", "ka", "kayo"),
                      "mahal" to listOf("kita", "ko", "na"),
                      "gusto" to listOf("ko", "kong", "mo"),
                      "pwede" to listOf("ba", "po", "ko")
                  )
              }
          }
