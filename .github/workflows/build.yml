          package com.example.customkeyboard

          import android.content.ClipDescription
          import android.content.Context
          import android.content.Intent
          import android.inputmethodservice.InputMethodService
          import android.net.Uri
          import android.os.Build
          import androidx.core.content.FileProvider
          import androidx.core.view.inputmethod.EditorInfoCompat
          import androidx.core.view.inputmethod.InputConnectionCompat
          import androidx.core.view.inputmethod.InputContentInfoCompat
          import java.io.File

          /** Copies images into our own FileProvider and sends them to the focused app. */
          object ImageShare {
              const val AUTH = "com.example.customkeyboard.files"

              fun dir(ctx: Context) = File(ctx.cacheDir, "shared").apply { mkdirs() }

              /** Copies [src] into the shared folder and returns a FileProvider Uri for it. */
              fun copyToShared(ctx: Context, src: Uri, name: String): Uri? {
                  return try {
                      val f = File(dir(ctx), name)
                      val input = ctx.contentResolver.openInputStream(src) ?: return null
                      input.use { i -> f.outputStream().use { o -> i.copyTo(o) } }
                      FileProvider.getUriForFile(ctx, AUTH, f)
                  } catch (e: Exception) {
                      null
                  }
              }

              /** Returns true if the focused app accepted the image directly. */
              fun send(service: InputMethodService, uri: Uri, mime: String): Boolean {
                  val ic = service.currentInputConnection ?: return false
                  val ei = service.currentInputEditorInfo ?: return false
                  val supported = EditorInfoCompat.getContentMimeTypes(ei)
                  if (supported.none { ClipDescription.compareMimeTypes(mime, it) }) return false
                  service.grantUriPermission(ei.packageName, uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  val info = InputContentInfoCompat(uri, ClipDescription("image", arrayOf(mime)), null)
                  val flags = if (Build.VERSION.SDK_INT >= 25) InputConnectionCompat.INPUT_CONTENT_GRANT_READ_URI_PERMISSION else 0
                  return InputConnectionCompat.commitContent(ic, ei, info, flags, null)
              }
          }
