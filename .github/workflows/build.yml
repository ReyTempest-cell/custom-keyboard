          package com.example.customkeyboard

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.ColorFilter
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.graphics.RectF
          import android.graphics.drawable.Drawable

          /** A key background with a layered neon glow around its edge. */
          class GlowDrawable(private val radius: Float, private val density: Float) : Drawable() {
              var fill = Color.parseColor("#CC14141C")
              var edge = Color.RED
              var strength = 1f

              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val r = RectF()
              private val widths = floatArrayOf(8f, 5f, 3f, 1.5f)
              private val alphas = intArrayOf(38, 70, 120, 255)

              override fun draw(c: Canvas) {
                  p.style = Paint.Style.FILL
                  p.color = fill
                  r.set(bounds)
                  c.drawRoundRect(r, radius, radius, p)
                  p.color = Color.argb(26, Color.red(edge), Color.green(edge), Color.blue(edge))
                  c.drawRoundRect(r, radius, radius, p)
                  p.style = Paint.Style.STROKE
                  for (i in widths.indices) {
                      val w = widths[i] * density
                      p.strokeWidth = w
                      val a = (alphas[i] * strength).toInt().coerceIn(0, 255)
                      p.color = Color.argb(a, Color.red(edge), Color.green(edge), Color.blue(edge))
                      r.set(bounds)
                      r.inset(w / 2f, w / 2f)
                      c.drawRoundRect(r, radius, radius, p)
                  }
              }

              override fun setAlpha(alpha: Int) {}
              override fun setColorFilter(colorFilter: ColorFilter?) {}
              @Deprecated("Deprecated in Java")
              override fun getOpacity() = PixelFormat.TRANSLUCENT
          }
