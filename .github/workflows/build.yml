          mkdir -p app/src/main/java/com/example/customkeyboard
          cat > app/src/main/java/com/example/customkeyboard/SettingsActivity.kt <<'KBEOF'
          package com.example.customkeyboard

          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import java.io.File

          class SettingsActivity : ComponentActivity() {

              private val red = Color.parseColor("#FF1744")

              private val picker =
                  registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                      if (uri != null) saveBackground(uri)
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("kb", Context.MODE_PRIVATE)

                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(40), dp(20), dp(24))
                  }

                  col.addView(TextView(this).apply {
                      text = "CUSTOM KEYBOARD"
                      setTextColor(red)
                      textSize = 26f
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      letterSpacing = 0.12f
                  })
                  col.addView(label("RGB gaming keyboard · English + Filipino"))

                  col.addView(section("1 · Set up"))
                  col.addView(button("Enable keyboard") {
                      startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS))
                  })
                  col.addView(button("Switch to Custom Keyboard") {
                      (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager)
                          .showInputMethodPicker()
                  })

                  col.addView(section("2 · Look"))
                  col.addView(button("Choose background image") {
                      picker.launch(arrayOf("image/*"))
                  })
                  col.addView(button("Remove background") {
                      File(filesDir, "background.jpg").delete()
                      toast("Background removed")
                  })
                  col.addView(label("Background dimming"))
                  col.addView(SeekBar(this).apply {
                      max = 230
                      progress = prefs.getInt("dim", 160)
                      progressTintList = android.content.res.ColorStateList.valueOf(red)
                      thumbTintList = android.content.res.ColorStateList.valueOf(red)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, v: Int, fromUser: Boolean) {
                              prefs.edit().putInt("dim", v).apply()
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  })
                  col.addView(toggle("RGB light bar", prefs.getBoolean("rgb", true)) {
                      prefs.edit().putBoolean("rgb", it).apply()
                  })
                  col.addView(toggle("Animations", prefs.getBoolean("anim", true)) {
                      prefs.edit().putBoolean("anim", it).apply()
                  })

                  col.addView(label("Accent color"))
                  col.addView(LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      listOf("#FF1744", "#FF3D00", "#FF4081", "#D50000").forEach { hex ->
                          addView(View(this@SettingsActivity).apply {
                              background = GradientDrawable().apply {
                                  shape = GradientDrawable.OVAL
                                  setColor(Color.parseColor(hex))
                              }
                              setOnClickListener {
                                  prefs.edit().putInt("accent", Color.parseColor(hex)).apply()
                                  toast("Accent updated")
                              }
                          }, LinearLayout.LayoutParams(dp(46), dp(46)).apply { rightMargin = dp(14) })
                      }
                  })
                  col.addView(toggle("Full RGB rainbow mode", prefs.getBoolean("rainbow", false)) {
                      prefs.edit().putBoolean("rainbow", it).apply()
                  })

                  col.addView(section("3 · Try it"))
                  col.addView(EditText(this).apply {
                      hint = "Tap here to test the keyboard"
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                  })

                  setContentView(ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#0B0B10"))
                      addView(col)
                  })
              }

              private fun saveBackground(uri: Uri) {
                  try {
                      val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                      var sample = 1
                      while (bounds.outWidth / sample > 1600) sample *= 2
                      val bmp = contentResolver.openInputStream(uri)?.use {
                          BitmapFactory.decodeStream(it, null, BitmapFactory.Options().apply { inSampleSize = sample })
                      } ?: return toast("Couldn't read that image")
                      File(filesDir, "background.jpg").outputStream().use {
                          bmp.compress(Bitmap.CompressFormat.JPEG, 88, it)
                      }
                      toast("Background saved")
                  } catch (e: Exception) {
                      toast("Couldn't load that image")
                  }
              }

              // ---- small UI helpers
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private fun label(t: String) = TextView(this).apply {
                  text = t; setTextColor(Color.LTGRAY); textSize = 14f
                  setPadding(0, dp(6), 0, dp(6))
              }

              private fun section(t: String) = TextView(this).apply {
                  text = t; setTextColor(red); textSize = 16f
                  typeface = android.graphics.Typeface.DEFAULT_BOLD
                  setPadding(0, dp(24), 0, dp(6))
              }

              private fun button(t: String, onClick: () -> Unit) = Button(this).apply {
                  text = t
                  setTextColor(Color.WHITE)
                  isAllCaps = false
                  background = GradientDrawable().apply {
                      cornerRadius = dp(10).toFloat()
                      setColor(Color.parseColor("#1A1A22"))
                      setStroke(dp(1), red)
                  }
                  layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(50))
                      .apply { topMargin = dp(8) }
                  setOnClickListener { onClick() }
              }

              private fun toggle(t: String, on: Boolean, onChange: (Boolean) -> Unit) = Switch(this).apply {
                  text = t
                  isChecked = on
                  setTextColor(Color.WHITE)
                  gravity = Gravity.CENTER_VERTICAL
                  setPadding(0, dp(12), 0, dp(12))
                  setOnCheckedChangeListener { _, v -> onChange(v) }
              }
          }
